<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RSVP — pick a time</title>
<link rel="stylesheet" href="public/styles.css" />
</head>
<body>
<div class="container">
  <div id="header-default">
    <h1 id="default-title">RSVP</h1>
    <p id="default-description"></p>
    <div class="address" id="default-address"></div>
    <p class="muted" id="default-subtitle">Pick the time you plan to come</p>
  </div>

  <div id="header-party" style="display:none;">
    <h1 id="party-title"></h1>
    <p id="party-description"></p>
    <div class="address" id="party-address"></div>
    <p class="muted" id="party-confirm">You're coming <strong id="party-range"></strong>. Update your time or name below to change your RSVP.</p>
  </div>

  <!-- Time picker + density. Hidden unless the server enables COLLECT_TIMES. -->
  <div id="time-section" style="display:none;">
    <div class="legend">
      <span>quiet</span>
      <div class="legend-bar"></div>
      <span>busy</span>
    </div>
    <div id="range-display" class="range-display">Tap a row to set your arrival time, then tap another to set when you'll leave.</div>
    <div id="slots" aria-label="Time range picker"></div>
  </div>

  <div class="form-row">
    <label for="name">Your name</label>
    <input id="name" type="text" autocomplete="name" maxlength="80" placeholder="e.g. Alex Rivera" />
  </div>

  <div class="form-row">
    <label for="phone">Your phone number</label>
    <input id="phone" type="tel" autocomplete="tel-national" inputmode="tel" maxlength="40" placeholder="e.g. (415) 555-2671" />
  </div>

  <div id="error" class="error" role="alert"></div>

  <button id="submit" class="btn" disabled>Submit RSVP</button>
</div>
<script src="public/main.js"></script>
</body>
</html>
